# Temporary: compares the old and new script addresses (harmless requests, no personal data).
name: Live speed test
on:
  push:
    branches: ["speedtest/live"]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Old vs new address
        run: |
          NEW='https://script.google.com/macros/s/AKfycbwKplcDw6m0a3R5TNd1mLPsm8IrcX8hlMFQSTEHQE4QwcBalHRqC7AiuxGQ3lY_KiD4/exec'
          OLD='https://script.google.com/macros/s/AKfycbx-K_3VArxV25Jkv_ecefRr_23Fp3FEZpqUw2zhQr-IWNeyb3oYI-1wXBajKFQtwGAj/exec'
          for name in NEW OLD; do U=${!name}
            for i in 1 2 3 4 5; do
              code=$(curl -sS -L -m 90 -o r.txt -w '%{http_code}' -H 'Content-Type: text/plain' --data '{"action":"lookup","code":"ZZZZZ-ZZZZZ"}' "$U")
              echo "$name lookup $i: HTTP $code -> $(head -c 110 r.txt | tr '\n' ' ')"
            done
          done
          echo "== website headers"; curl -sS -I -m 60 https://msburberryy-web.github.io/HtooAndMay_GiftToYou/ | grep -i -E 'cache-control|last-modified|age:'
