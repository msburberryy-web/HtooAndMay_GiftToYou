# Temporary: looks up an Aesop gift kit on the Japanese site (title and price only).
name: Live speed test
on:
  push:
    branches: ["speedtest/live"]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Aesop Japan
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36'
          for u in \
            https://www.aesop.com/jp/gifts/seasonal-gift-kits/greetings-in-the-guest-room/APB364JP.html \
            https://www.aesop.com/jp/gifts/seasonal-gift-kits/ \
            https://www.aesop.com/jp/gifts/kits-and-sets/ ; do
            code=$(curl -sS -L -m 60 -A "$UA" -H 'Accept-Language: ja' -o p.html -w '%{http_code}' "$u"); echo "== $code $u"
            python3 - <<'PY'
          import re,html
          s=open('p.html',encoding='utf-8',errors='replace').read()
          t=re.search(r'(?is)<title>(.*?)</title>',s); print('TITLE:',html.unescape(t.group(1)).strip()[:120] if t else '-')
          for m in re.finditer(r'"name"\s*:\s*"([^"]{3,80})"[^{}]{0,400}?"price"\s*:\s*"?([\d.,]+)',s): print('  ITEM:',m.group(1),'¥',m.group(2))
          for m in list(re.finditer(r'(Greetings|Gracious|グリーティング|ゲストルーム)',s))[:8]:
              print('  …',re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',s[max(0,m.start()-120):m.end()+160])))
          for m in list(re.finditer(r'¥\s?[\d,]{3,7}',s))[:6]: print('  PRICE:',m.group(0))
          PY
          done
