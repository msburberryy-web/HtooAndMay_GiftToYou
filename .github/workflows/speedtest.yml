# Temporary: checks the new live script address with harmless requests (public gift list, a made-up code).
name: Live speed test
on:
  push:
    branches: ["speedtest/live"]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Check new address
        run: |
          U='https://script.google.com/macros/s/AKfycbwKplcDw6m0a3R5TNd1mLPsm8IrcX8hlMFQSTEHQE4QwcBalHRqC7AiuxGQ3lY_KiD4/exec'
          printf "GET: "; curl -sS -L -m 90 "$U" | head -c 120; echo
          printf "catalogue: "; curl -sS -L -m 90 -H 'Content-Type: text/plain' --data '{"action":"catalogue"}' "$U" | python3 -c "import sys,json;r=json.load(sys.stdin);d=r.get('data') or {};print('ok=',r.get('ok'),'open=',d.get('open'),'gifts=',len(d.get('gifts') or []),'err=',r.get('error'))"
          printf "init made-up code: "; curl -sS -L -m 90 -H 'Content-Type: text/plain' --data '{"action":"init","code":"ZZZZZZZZZZ"}' "$U" | python3 -c "import sys,json;r=json.load(sys.stdin);d=r.get('data') or {};print('ok=',r.get('ok'),'lookupError=',d.get('lookupError'))"
