# Temporary: checks whether the live script returns a gift message (prints only field names and lengths, no personal data). Run 2.
name: Live speed test
on:
  push:
    branches: ["speedtest/live"]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Check message field
        run: |
          U='https://script.google.com/macros/s/AKfycbx-K_3VArxV25Jkv_ecefRr_23Fp3FEZpqUw2zhQr-IWNeyb3oYI-1wXBajKFQtwGAj/exec'
          for a in lookup init; do
            curl -sS -L -m 90 -H 'Content-Type: text/plain' --data "{\"action\":\"$a\",\"code\":\"E1FC7462A5DA4CBC9B42\"}" "$U" -o r.json
            python3 - "$a" <<'PY'
          import json,sys
          r=json.load(open('r.json')); a=sys.argv[1]
          d=r.get('data') or {}; d=d.get('lookup',d) if a=='init' else d
          print(a, 'ok=',r.get('ok'), 'status=',r.get('status'), 'reason=',r.get('reason'), 'keys=',sorted(d.keys()) if isinstance(d,dict) else '-', 'has message field=', isinstance(d,dict) and 'message' in d, 'message length=', len(d.get('message') or '') if isinstance(d,dict) else '-')
          PY
          done
