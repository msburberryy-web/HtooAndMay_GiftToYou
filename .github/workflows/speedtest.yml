# Temporary: times harmless requests to the live Apps Script (public gift list and a made-up code only).
name: Live speed test
on:
  push:
    branches: ["speedtest/live"]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Time requests
        run: |
          U='https://script.google.com/macros/s/AKfycbx-K_3VArxV25Jkv_ecefRr_23Fp3FEZpqUw2zhQr-IWNeyb3oYI-1wXBajKFQtwGAj/exec'
          t() { curl -sS -L -o body.txt -H 'Content-Type: text/plain' -w "%{time_total}s (redirect %{time_redirect}s, HTTP %{http_code})" "$@" "$U"; echo "  -> $(head -c 90 body.txt)"; }
          echo "== keep-awake check (GET)"; for i in 1 2 3; do printf "get $i: "; t; done
          echo "== gift list (catalogue)"; for i in 1 2 3 4 5; do printf "cat $i: "; t --data '{"action":"catalogue"}'; done
          echo "== first visit with a code (init, made-up code)"; for i in 1 2 3; do printf "init $i: "; t --data '{"action":"init","code":"ZZZZZZZZZZZZ"}'; done
